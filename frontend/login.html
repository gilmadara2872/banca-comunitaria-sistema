<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Entrar — Banca Comunitária</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: #f5f5f5; min-height: 100vh;
            display: flex; align-items: center; justify-content: center; padding: 20px;
        }
        .card {
            background: white; border-radius: 12px; padding: 32px 24px;
            width: 100%; max-width: 360px;
            box-shadow: 0 2px 12px rgba(0,0,0,0.08); text-align: center;
        }
        .icone { font-size: 44px; margin-bottom: 12px; }
        h1 { font-size: 20px; color: #333; margin-bottom: 6px; }
        .sub { font-size: 13px; color: #777; margin-bottom: 24px; }
        input {
            width: 100%; padding: 12px; margin-bottom: 12px;
            border: 1px solid #ddd; border-radius: 6px;
            font-size: 15px; text-align: center;
        }
        input:focus { outline: none; border-color: #007bff; }
        button {
            width: 100%; padding: 13px; border: none; border-radius: 6px;
            background: #007bff; color: white; font-size: 15px;
            font-weight: 500; cursor: pointer;
        }
        button:active { background: #0056b3; }
        button:disabled { background: #ccc; cursor: not-allowed; }
        .erro {
            background: #f8d7da; color: #721c24; padding: 10px;
            border-radius: 6px; font-size: 13px; margin-bottom: 14px;
            display: none;
        }
        .aviso {
            background: #fff3cd; color: #856404; padding: 10px;
            border-radius: 6px; font-size: 12px; margin-top: 16px;
            display: none; line-height: 1.5;
        }
        .rodape { margin-top: 20px; font-size: 11px; color: #aaa; }
    </style>
</head>
<body>
    <div class="card">
        <div class="icone">🏪</div>
        <h1>Banca Comunitária</h1>
        <p class="sub">Entre com a senha da equipe</p>

        <div class="erro" id="erro"></div>

        <input type="password" id="senha" placeholder="Senha"
               autocomplete="current-password" autofocus>
        <button id="btn-entrar" onclick="entrar()">Entrar</button>

        <div class="aviso" id="aviso"></div>

        <p class="rodape">Sistema de Gestão de Doações</p>
    </div>

<script>
async function entrar() {
    const campo = document.getElementById('senha');
    const botao = document.getElementById('btn-entrar');
    const erro  = document.getElementById('erro');
    const senha = campo.value;

    if (!senha) {
        mostrarErro('Digite a senha');
        return;
    }

    botao.disabled = true;
    botao.textContent = 'Entrando...';
    erro.style.display = 'none';

    try {
        const res = await fetch('/login', {
            method: 'POST',
            headers: {'Content-Type': 'application/json'},
            body: JSON.stringify({senha})
        });
        const dados = await res.json();

        if (dados.sucesso) {
            window.location.href = '/';
        } else {
            mostrarErro(dados.erro || 'Não foi possível entrar');
            botao.disabled = false;
            botao.textContent = 'Entrar';
            campo.value = '';
            campo.focus();
        }
    } catch (e) {
        mostrarErro('Erro de conexão. Verifique a internet.');
        botao.disabled = false;
        botao.textContent = 'Entrar';
    }
}

function mostrarErro(msg) {
    const erro = document.getElementById('erro');
    erro.textContent = msg;
    erro.style.display = 'block';
}

// Enter envia o formulário
document.getElementById('senha').addEventListener('keydown', e => {
    if (e.key === 'Enter') entrar();
});

// Se o servidor ainda não tem senha configurada, avisa na tela
(async () => {
    try {
        const res = await fetch('/api/sessao');
        const dados = await res.json();
        if (dados.login_configurado === false) {
            const aviso = document.getElementById('aviso');
            aviso.innerHTML = '⚠️ <strong>Login não configurado.</strong><br>' +
                             'Peça para o administrador definir a variável ' +
                             '<code>ADMIN_SENHA</code> no servidor.';
            aviso.style.display = 'block';
        }
    } catch (e) { /* segue normal */ }
})();
</script>
</body>
</html>
