services:
  banca-app:
    build: .
    container_name: banca-app
    ports:
      - "5000:5000"
    environment:
      - PORT=5000
      - DATABASE_URL=postgresql://postgres:htrGxerOVIIARoIVtPTbicbrjlvORjwK@postgres.railway.internal:5432/railway
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:5000/api/resumo')"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s