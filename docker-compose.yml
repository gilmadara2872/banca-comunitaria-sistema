# ─── docker-compose.yml — Sistema Banca Alimentícia ────────────────────────
# Testar localmente: docker compose up -d
# Parar:           docker compose down
# ────────────────────────────────────────────────────────────────────────────
# Banca usa SQLite (banco em arquivo). O arquivo banca.db fica em /data
# dentro do container, montado em um nome volume para persistência.
# ────────────────────────────────────────────────────────────────────────────

services:
  banca-app:
    build: .
    container_name: banca-app
    ports:
      - "5000:5000"
    environment:
      - DATA_DIR=/data
      - PORT=5000
    volumes:
      # O SQLite fica aqui e sobrevive a reinicializações do container
      - banca_data:/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:5000/api/resumo')"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

volumes:
  banca_data:
